competition: rsna-knee-abnormality-detection
exp_name: reader_repro
fold: 0
seed: 42
paths:
  data_dir: data
  raw_data: data/raw
  processed_data: data/processed
  cache_dir: data/processed/cache_280_reader
  labels_dir: data/labels
  model_dir: models
  log_dir: logs
  oof_dir: models/oof
data:
  train_file: data/raw/train.csv
  train_series_file: data/raw/train_series.csv
  test_file: data/raw/test.csv
  test_series_file: data/raw/test_series.csv
  sample_submission_file: data/raw/sample_submission.csv
  train_dicom_dir: data/raw/train_series
  test_dicom_dir: data/raw/test_series
  folds_file: /root/rsna-knee/configs/folds_5.csv
  num_folds: 5
labels:
  sources:
  - llm_labels_v4_blend.csv
  - report_labels_v2.csv
  - labels_llm_gpt56sol.csv
  - qwen_knee_weak_labels.csv
  weights: null
  silence: null
  pseudo:
    enabled: false
    oof_files: []
    weight: 0.5
    per_label_weight:
      Synovitis: 0.7
      PF OA: 0.6
      Lateral OA: 0.6
  hard: false
  clip:
  - 0.01
  - 0.99
preprocess:
  res: 280
  crop_mm: 140
  canonical: false
  span:
  - 0.04
  - 0.96
  clip_percentiles:
  - 1
  - 99.5
  slots:
    sag_fs:
      plane: Sagittal
      fat: 1
    cor_fs:
      plane: Coronal
      fat: 1
    ax_fs:
      plane: Axial
      fat: 1
    sag:
      plane: Sagittal
      fat: 0
    cor:
      plane: Coronal
      fat: 0
    ax:
      plane: Axial
      fat: 0
  num_workers: 8
  compress: false
  limit: 0
  part: 0
  parts: 1
  layout: series
  series_pick: first
  mm_per_px: 0.55
  max_slices: 64
  max_cands: 2
model:
  backbone: convnext_tiny.fb_in22k_ft_in1k
  pretrained: true
  img_size: 256
  drop_rate: 0.2
  drop_path_rate: 0.1
  head: transformer_mil
  slot_embedding: true
  grad_checkpointing: true
  channels_last: true
windows:
  k_train: 8
  k_eval: 12
  k_val: null
  sampling: stratified
  cross_slot: false
  span:
  - 0.04
  - 0.96
  random_series: true
  fov: 0.92
augmentation:
  enabled: true
  preset: reader_gpu
  brightness_contrast: 0.2
  gamma:
  - 0.8
  - 1.2
  shift_scale_rotate:
    shift: 0.06
    scale: 0.1
    rotate: 10
  window_dropout: 0.0
training:
  batch_size: 8
  num_epochs: 14
  lr: 0.0005
  backbone_lr_mult: 0.2
  weight_decay: 0.02
  warmup_epochs: 1
  loss: bce
  pos_weight: null
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 3.0
  ema: 0.998
  ema_eval: true
  schedule: cosine
  pct_start: 0.15
  top_k_average: 0
  monitor: val_auc_report
  max_time: null
  val_every: 1
evaluation:
  gold_eval: true
logging:
  wandb:
    enabled: false
    project: rsna-knee
    entity: null
    tags: []
inference:
  batch_size: 1
  tta: false
  checkpoints: []
  rank_average: false
resources:
  num_workers: 16
  devices: 1
