# RSNA Knee Abnormality Detection — default experiment config.
# Any key can be overridden from the CLI:  python -m src.models.train_pl exp=coatnet_384 fold=0 training.lr=2e-4

competition: rsna-knee-abnormality-detection
exp_name: baseline_effnet224
fold: 0            # which fold to hold out; -1 = train on everything (full-fit)
seed: 42

# Paths
paths:
  data_dir: ${oc.env:DATA_DIR,data}
  raw_data: ${paths.data_dir}/raw                      # kaggle competitions download -> unzip here
  processed_data: ${paths.data_dir}/processed
  cache_dir: ${paths.processed_data}/cache_${preprocess.res}   # one .npz per study (see scripts/preprocess.py)
  labels_dir: ${paths.data_dir}/labels                 # public / own LLM label csv files
  model_dir: models
  log_dir: logs
  oof_dir: ${paths.model_dir}/oof

# Data files
data:
  train_file: ${paths.raw_data}/train.csv
  train_series_file: ${paths.raw_data}/train_series.csv
  test_file: ${paths.raw_data}/test.csv
  test_series_file: ${paths.raw_data}/test_series.csv
  sample_submission_file: ${paths.raw_data}/sample_submission.csv
  train_dicom_dir: ${paths.raw_data}/train_series
  test_dicom_dir: ${paths.raw_data}/test_series
  folds_file: ${repo:}/configs/folds_5.csv # committed canonical split (gold 58 = fold -1); shared by all runs
  num_folds: 5

# Training targets built from report-derived labels (see src/labeling/blend.py).
labels:
  # CSV files in paths.labels_dir with StudyInstanceUID + 12 label columns in [0, 1].
  # 0.5 is read as "report does not address this finding".
  sources:
    - llm_labels_v4_blend.csv      # stevenleehans/rsna-knee-llm-report-labels  (0.893 vs gold)
    - llm_labels_full.csv          # stevenleehans/rsna-knee-llm-report-labels  (0.878)
    - report_labels_v2.csv         # pilkwang/rsna-knee-llm-labels             (0.866)
  weights: null                    # null = equal weights
  # How to fill cells a source marks "not addressed" (== 0.5). Silence means "absent" for
  # findings radiologists always mention, and "unknown" for under-reported ones.
  silence:
    default: 0.10
    Synovitis: from_effusion       # P(syn|eff)=0.63 vs 0.22 on gold: fill from the Effusion cell
    PF OA: 0.25
    Fracture: 0.20
    Baker's: 0.03
    Medial OA: 0.03
  # Pseudo-label blend: y = (1-w) * y_report + w * oof_pred  (needs OOF preds from a teacher run)
  pseudo:
    enabled: false
    oof_files: []                  # e.g. [models/oof/coatnet384_teacher.csv]
    weight: 0.5
    per_label_weight:
      Synovitis: 0.7
      PF OA: 0.6
      Lateral OA: 0.6
  hard: false                      # round to 0/1 (soft targets are better)
  clip: null                       # e.g. [0.01, 0.99] (goodpjw's reader)

# DICOM -> cached uint8 stack. Each study becomes one (D, res, res) stack built from slots.
preprocess:
  res: 256                         # stored resolution; training can resize down
  crop_mm: 140                     # physical FOV (centre crop). Median FOV is 160 mm, so <=140 is
                                   # needed for the crop to apply to most series (130 -> 98.5%)
  canonical: true                  # mirror left knees to right, order slices anatomically
  span: [0.04, 0.96]               # fraction of each series to sample slices from
  clip_percentiles: [1, 99]
  # slot name -> (plane, fluid_sensitive, n_slices). Missing slots are zero-filled and masked.
  slots:
    sag_fs: {plane: Sagittal, fluid: 1, n: 20}
    sag_t1: {plane: Sagittal, fluid: 0, n: 10}
    cor_fs: {plane: Coronal, fluid: 1, n: 16}
    cor_t1: {plane: Coronal, fluid: 0, n: 8}
    ax_fs: {plane: Axial, fluid: 1, n: 14}
    ax_t1: {plane: Axial, fluid: 0, n: 4}
  num_workers: 8
  compress: false                  # savez_compressed (~2x smaller, for Kaggle's 20 GB output cap)
  limit: 0                         # >0: cache only the 58 gold + `limit` random studies (dry runs)
  part: 0                          # build only studies[part::parts] (big caches split over Kaggle notebooks)
  parts: 1
  layout: study                    # study = fixed slots per study | series = every series, native slices (reader)
  series_pick: first               # study layout: first (CSV order) | most_slices among a slot's candidates
  mm_per_px: null                  # series layout: physical pixel size; frame = res * mm_per_px mm
  max_slices: 64                   # series layout: linspace down to this many slices per series
  max_cands: 2                     # series layout: keep the largest N series per slot

# Model
model:
  backbone: tf_efficientnet_b0.ns_jft_in1k
  pretrained: true
  img_size: 224
  drop_rate: 0.2
  drop_path_rate: 0.1
  head: attn_mil                   # attn_mil (per-finding attention pooling) | mean | max
  slot_embedding: true
  grad_checkpointing: false
  channels_last: false             # NHWC layout for CNNs on Ampere+ GPUs (speed only)
  pretrained_path: null            # external encoder weights loaded at training start (e.g. RadImageNet ResNet-50)
  unfreeze_last: null              # ViTs: train only the last N transformer blocks (+ final norm)

# 2.5D windows (3 adjacent slices -> RGB) sampled per study
windows:
  k_train: 16
  k_eval: 48                       # 0 = every window position (study layout)
  k_val: null                      # windows for per-epoch validation (null = k_eval); final OOF/gold use k_eval
  sampling: uniform                # uniform | stratified (one random centre per equal bin)
  cross_slot: false                # Raptor: windows over the concatenated stack, centred-on-empty masked
  span: [0.04, 0.96]               # series layout: window centres over this part of each series
  random_series: false             # series layout: random candidate series per slot in training
  fov: null                        # series layout: centred crop fraction of the cached frame before resizing

augmentation:
  enabled: true
  preset: ours                     # ours (below) | gain_only (Raptor: +-10% gain) | reader_gpu (series layout)
  # NO horizontal flips — laterality/compartment (medial vs lateral) is signal.
  brightness_contrast: 0.2
  gamma: [0.8, 1.2]
  shift_scale_rotate: {shift: 0.06, scale: 0.1, rotate: 10}
  window_dropout: 0.1              # randomly drop windows from the bag

training:
  batch_size: 8
  num_epochs: 15
  lr: 3.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.02
  warmup_epochs: 1
  loss: bce                        # bce (soft targets) | focal
  pos_weight: null
  precision: 16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  ema: 0.0                         # e.g. 0.998; 0 disables
  ema_eval: true                   # validate / export the EMA weights
  schedule: cosine                 # cosine (warmup_epochs) | onecycle (pct_start)
  pct_start: 0.15
  top_k_average: 3                 # average weights of best-k epochs at the end
  top_k_mode: best                 # best (by monitor) | last (last k epochs; all-data runs)
  monitor: val_auc_report          # macro AUC vs report labels on the held-out fold
  max_time: null                   # wall-clock cap "DD:HH:MM:SS" (Kaggle 12 h sessions); stops cleanly
  val_every: 1                     # validate every n epochs (heavy backbones: 2)

evaluation:
  gold_eval: true                  # also report AUC vs the 58 radiologist-labelled studies

logging:
  wandb:
    enabled: false
    project: rsna-knee
    entity: null
    tags: []

inference:
  batch_size: 1
  tta: false
  checkpoints: []                  # list of .ckpt / .pt paths to ensemble
  rank_average: false

resources:
  num_workers: 8
  devices: 1
