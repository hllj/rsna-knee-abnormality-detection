# ITER-07 candidate — reader v2 = reader_repro (EXP-042, LB 0.922 fold 0) + the fixes from the ITER-06 review:
#   * top-3 averaging of the (EMA) weights by val AUC instead of exporting the last epoch: EXP-042 peaked at epoch
#     8-9 (report 0.8865, gold 0.9155) and drifted to 0.8854 / 0.9069 by epoch 13 while train loss kept falling
#   * 11 epochs instead of 14 (the cosine schedule then anneals around the observed peak; ~25% less GPU time)
#   * our default label blend (3 sources + silence priors) instead of goodpjw's 4-table mean: the reader had the
#     lowest CV on our targets and the lowest LB, and its labels are the main difference from our pipeline
# Same cache as reader_repro (cache_280_reader). Validate on fold 0 (vs EXP-042) before folds 1-4.
exp_name: reader_v2
paths:
  cache_dir: ${paths.processed_data}/cache_280_reader
preprocess:
  layout: series
  res: 280
  mm_per_px: 0.55
  max_slices: 64
  max_cands: 2
  clip_percentiles: [1, 99.5]
  canonical: false
  slots:                           # slot index = plane + 3 * (1 - Fat_Suppression)
    sag_fs: {plane: Sagittal, fat: 1}
    cor_fs: {plane: Coronal, fat: 1}
    ax_fs: {plane: Axial, fat: 1}
    sag: {plane: Sagittal, fat: 0}
    cor: {plane: Coronal, fat: 0}
    ax: {plane: Axial, fat: 0}
model:
  backbone: convnext_tiny.fb_in22k_ft_in1k
  img_size: 256
  head: transformer_mil            # proj(dim 384)+slot emb+slice-position emb -> 2-layer transformer -> attention/finding
  slot_embedding: true
  drop_rate: 0.2
  drop_path_rate: 0.1
  grad_checkpointing: true         # batch 8 x 48 windows @256 OOMs a 24 GB 3090 without it (9.1 GiB with)
  channels_last: true
windows:
  k_train: 8                       # per series slot
  k_eval: 12                       # per series slot
  sampling: stratified             # one random centre in each of k equal bins over 4-96% of the series
  span: [0.04, 0.96]
  random_series: true              # training: random candidate series of a slot; eval: the largest
  fov: 0.92                        # centre crop of the cached frame before resizing to img_size
augmentation:
  preset: reader_gpu               # rot +-12 deg, scale +-12%, shift +-6%, gamma exp(+-0.25), gain +-10%, per series
  window_dropout: 0.0
training:
  batch_size: 8
  accumulate_grad_batches: 1
  num_epochs: 11
  lr: 5.0e-4                       # head
  backbone_lr_mult: 0.2            # backbone 1e-4
  weight_decay: 0.02
  schedule: cosine
  warmup_epochs: 1
  loss: bce
  gradient_clip_val: 3.0
  precision: bf16-mixed
  ema: 0.998
  ema_eval: true                   # validate / save the EMA weights
  top_k_average: 3                # average the best-3 epochs' EMA weights
  val_every: 1
# labels: default blend from configs/default.yaml (no override)
