# Round-2 student: report labels blended with out-of-fold teacher predictions.
# Run all 5 folds of a teacher first (each writes models/oof/<exp>_fold{k}.csv), then
# python scripts/merge_oof.py --exp coatnet2_384  -> models/oof/coatnet2_384.csv
exp_name: student_pseudo
labels:
  pseudo:
    enabled: true
    oof_files: [models/oof/coatnet2_384.csv]
    weight: 0.5
