# ITER-07 — reader v3 = reader_repro (EXP-042: goodpjw's 4-table labels, 14 epochs; LB 0.922 fold 0) + ONLY top-3
# averaging of the EMA weights. Isolates the label question raised by reader_v2 (EXP-050): v2 (our labels) gained
# held-out CV but lost ~0.012 gold at every epoch, so v3 keeps v1's labels and only fixes the export (v1 peaked at
# epochs 7-9 - report 0.8865 / gold 0.915 - and exported the last-epoch EMA, 0.8854 / 0.907).
exp_name: reader_v3
paths:
  cache_dir: ${paths.processed_data}/cache_280_reader
preprocess:
  layout: series
  res: 280
  mm_per_px: 0.55
  max_slices: 64
  max_cands: 2
  clip_percentiles: [1, 99.5]
  canonical: false
  slots:                           # slot index = plane + 3 * (1 - Fat_Suppression)
    sag_fs: {plane: Sagittal, fat: 1}
    cor_fs: {plane: Coronal, fat: 1}
    ax_fs: {plane: Axial, fat: 1}
    sag: {plane: Sagittal, fat: 0}
    cor: {plane: Coronal, fat: 0}
    ax: {plane: Axial, fat: 0}
model:
  backbone: convnext_tiny.fb_in22k_ft_in1k
  img_size: 256
  head: transformer_mil            # proj(dim 384)+slot emb+slice-position emb -> 2-layer transformer -> attention/finding
  slot_embedding: true
  drop_rate: 0.2
  drop_path_rate: 0.1
  grad_checkpointing: true         # batch 8 x 48 windows @256 OOMs a 24 GB 3090 without it (9.1 GiB with)
  channels_last: true
windows:
  k_train: 8                       # per series slot
  k_eval: 12                       # per series slot
  sampling: stratified             # one random centre in each of k equal bins over 4-96% of the series
  span: [0.04, 0.96]
  random_series: true              # training: random candidate series of a slot; eval: the largest
  fov: 0.92                        # centre crop of the cached frame before resizing to img_size
augmentation:
  preset: reader_gpu               # rot +-12 deg, scale +-12%, shift +-6%, gamma exp(+-0.25), gain +-10%, per series
  window_dropout: 0.0
training:
  batch_size: 8
  accumulate_grad_batches: 1
  num_epochs: 14
  lr: 5.0e-4                       # head
  backbone_lr_mult: 0.2            # backbone 1e-4
  weight_decay: 0.02
  schedule: cosine
  warmup_epochs: 1
  loss: bce
  gradient_clip_val: 3.0
  precision: bf16-mixed
  ema: 0.998
  ema_eval: true                   # validate / save the EMA weights
  top_k_average: 3                # average the best-3 epochs' EMA weights
  val_every: 1
labels:                            # mean of 4 public tables, no silence filling, clipped (goodpjw make_labels v0)
  sources:
    - llm_labels_v4_blend.csv      # stevenleehans/rsna-knee-llm-report-labels
    - report_labels_v2.csv         # pilkwang/rsna-knee-llm-labels
    - labels_llm_gpt56sol.csv      # lixin73/rsna-knee-llm-report-labels-sol56
    - qwen_knee_weak_labels.csv    # laymond/rsna-knee-abnormality-qwen3-8b-weak-labels (<finding>__label)
  silence: null
  clip: [0.01, 0.99]
